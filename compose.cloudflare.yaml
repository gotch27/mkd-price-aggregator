services:
  cloudflared:
    image: ${CLOUDFLARED_IMAGE:?required}
    user: ${CLOUDFLARED_UID:?required}:${CLOUDFLARED_GID:?required}
    command:
      - tunnel
      - --no-autoupdate
      - --config
      - /etc/cloudflared/config.yml
      - --metrics
      - 127.0.0.1:2000
      - run
    volumes:
      - ./.data/cloudflared/config.yml:/etc/cloudflared/config.yml:ro
      - ./.data/cloudflared/credentials.json:/etc/cloudflared/credentials.json:ro
    mem_limit: ${CLOUDFLARED_MEMORY_LIMIT:?required}
    cpus: ${CLOUDFLARED_CPUS:?required}
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    depends_on:
      web:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - cloudflared
        - tunnel
        - --metrics
        - 127.0.0.1:2000
        - ready
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
